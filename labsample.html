<!DOCTYPE html>
<html>
<head>
    <title>My Basic Web Page</title>
</head>

<body>

    <div>
        <h1>Welcome to My Web Page</h1>

        <p>
            Hello! My name is <b>John</b>.<br>
            I am learning <i>HTML</i> as a beginner.
        </p>

        <p>
            This is a <span>simple HTML page</span> made using basic tags.
        </p>
    </div>

    <hr>

    <div>
        <h2>About HTML</h2>

        <p>
            HTML stands for <b>HyperText Markup Language</b>.
            It is used to create the structure of web pages.
        </p>

        <a href="https://www.google.com" target="_blank">
            Visit Google
        </a>
    </div>

    <br>

    <div>
        <h2>My Image</h2>

      
        <img src="https://static.vecteezy.com/system/resources/thumbnails/024/476/417/small/silhouette-of-unknown-young-teenager-isolated-on-transparent-background-free-photo.jpg"
              width= 200 alt="A sample image">

        <br><br>

    </div>

    <br>

    <div>
        <h2>My Form</h2>

        <form>

            <label>Name:</label>
            <input type="text" placeholder="Enter your name">

            <br><br>

            <label>Email:</label>
            <input type="email" placeholder="Enter your email">

            <br><br>

            <label>Password:</label>
            <input type="password" placeholder="Enter your password">

            <br><br>

            <label>Age:</label>
            <input type="number" placeholder="Enter your age">

            <br><br>

            <label>Date:</label>
            <input type="date">

            <br><br>

            <label>
                <input type="checkbox">
                I agree
            </label>

            <br><br>

            <label>Gender:</label>

            <input type="radio" name="gender">
            Male

            <input type="radio" name="gender">
            Female

            <br><br>

            <label>Country:</label>

            <select>
                <option>Bangladesh</option>
                <option>India</option>
                <option>Pakistan</option>
                <option>USA</option>
            </select>

            <br><br>

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>

        </form>
    </div>

</body>
</html>
